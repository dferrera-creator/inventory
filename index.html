<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Inspección</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <div id="app">

    <!-- ══════════ PASO 1: BIENVENIDA ══════════ -->
    <div id="step-welcome" class="step active">
      <div class="welcome-screen">
        <div class="welcome-icon"><span class="material-symbols-rounded icon-hero">assignment</span></div>
        <h1>Inspección</h1>
        <p class="welcome-sub">Toca para iniciar</p>

        <div class="form-card">
          <div class="form-group">
            <div class="input-icon"><span class="material-symbols-rounded">location_on</span></div>
            <input type="text" id="location" placeholder="Ubicación..." autocomplete="off">
          </div>
          <div class="form-group">
            <div class="input-icon"><span class="material-symbols-rounded">calendar_today</span></div>
            <input type="date" id="date">
          </div>
          <div class="form-group">
            <div class="input-icon"><span class="material-symbols-rounded">person</span></div>
            <input type="text" id="auditor" placeholder="Tu nombre..." autocomplete="off">
          </div>
        </div>

        <button class="btn-start" onclick="startInspection()">
          <span class="material-symbols-rounded">play_arrow</span>
          INICIAR
        </button>
      </div>
    </div>

    <!-- ══════════ PASO 2: SELECCIÓN DE CUARTO ══════════ -->
    <div id="step-rooms" class="step">
      <div class="rooms-header">
        <div class="timer-bar" id="timer-bar">
          <span class="material-symbols-rounded timer-icon">timer</span>
          <span id="timer-display">00:00</span>
        </div>
        <h2>Elige un Cuarto</h2>
        <div class="overall-progress">
          <div class="overall-progress-bar" id="overall-bar"></div>
        </div>
        <p class="overall-label" id="overall-label">0 / 73 artículos</p>
      </div>
      <div id="room-grid" class="room-grid"></div>
    </div>

    <!-- ══════════ PASO 3: INSPECCIÓN DE ARTÍCULO (UNO A LA VEZ) ══════════ -->
    <div id="step-item" class="step">
      <!-- Barra superior de progreso -->
      <div class="item-topbar">
        <button class="topbar-back" onclick="backToRooms()">
          <span class="material-symbols-rounded">arrow_back</span>
        </button>
        <div class="topbar-progress">
          <div class="topbar-progress-bar" id="item-progress-bar"></div>
        </div>
        <span class="topbar-count" id="item-count">1/10</span>
        <div class="topbar-timer" id="topbar-timer">00:00</div>
      </div>

      <!-- Área -->
      <div class="item-area" id="item-area">Cocina</div>

      <!-- Visual del artículo -->
      <div class="item-display">
        <div class="item-icon-wrap" id="item-icon-wrap">
          <span class="material-symbols-rounded item-icon" id="item-icon">local_fire_department</span>
        </div>
        <div class="item-name" id="item-name">Estufa</div>
        <div class="item-name-en" id="item-name-en">Stove</div>
      </div>

      <!-- Botones de estado (LA ACCIÓN PRINCIPAL) -->
      <div class="status-grid" id="status-grid">
        <button class="status-btn good" onclick="setStatus('good')">
          <span class="material-symbols-rounded status-mat-icon good-icon">check_circle</span>
          <span class="status-label">Bueno</span>
          <span class="status-label-en">Good</span>
        </button>
        <button class="status-btn damaged" onclick="setStatus('damaged')">
          <span class="material-symbols-rounded status-mat-icon damaged-icon">build</span>
          <span class="status-label">Dañado</span>
          <span class="status-label-en">Damaged</span>
        </button>
        <button class="status-btn missing" onclick="setStatus('missing')">
          <span class="material-symbols-rounded status-mat-icon missing-icon">cancel</span>
          <span class="status-label">Faltante</span>
          <span class="status-label-en">Missing</span>
        </button>
        <button class="status-btn new-item" onclick="setStatus('new')">
          <span class="material-symbols-rounded status-mat-icon new-icon">new_releases</span>
          <span class="status-label">Nuevo</span>
          <span class="status-label-en">New</span>
        </button>
      </div>

      <!-- Acciones secundarias (cantidad, foto, notas) -->
      <div class="item-extras">
        <div class="qty-row">
          <span class="qty-label">Cant:</span>
          <button class="qty-btn" onclick="changeQty(-1)">
            <span class="material-symbols-rounded">remove</span>
          </button>
          <span class="qty-value" id="qty-value">1</span>
          <button class="qty-btn" onclick="changeQty(1)">
            <span class="material-symbols-rounded">add</span>
          </button>
        </div>
        <div class="extras-row">
          <button class="extra-btn camera-btn" onclick="triggerPhoto()">
            <span class="material-symbols-rounded">photo_camera</span> Foto
          </button>
          <button class="extra-btn notes-btn" onclick="toggleNotes()">
            <span class="material-symbols-rounded">edit_note</span> Notas
          </button>
        </div>
        <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">
        <div class="photo-strip" id="photo-strip"></div>
        <div class="notes-area" id="notes-area" style="display:none">
          <textarea id="notes-input" placeholder="Notas..." rows="2"></textarea>
        </div>
      </div>

      <!-- Navegación -->
      <div class="item-nav">
        <button class="nav-prev" id="nav-prev" onclick="prevItem()">
          <span class="material-symbols-rounded">arrow_back</span> Atrás
        </button>
        <button class="nav-next" id="nav-next" onclick="nextItem()">
          Siguiente <span class="material-symbols-rounded">arrow_forward</span>
        </button>
      </div>
    </div>

    <!-- ══════════ PASO 4: CUARTO COMPLETADO ══════════ -->
    <div id="step-room-done" class="step">
      <div class="celebration">
        <div class="celebration-icon"><span class="material-symbols-rounded icon-celebrate">celebration</span></div>
        <h2 class="celebration-title" id="room-done-title">¡Cuarto Listo!</h2>
        <p class="celebration-sub" id="room-done-sub">Cocina completada</p>
        <div class="celebration-stats" id="room-done-stats"></div>
        <button class="btn-continue" onclick="backToRooms()">
          Continuar <span class="material-symbols-rounded">arrow_forward</span>
        </button>
      </div>
    </div>

    <!-- ══════════ PASO 5: TODO LISTO / EXPORTAR ══════════ -->
    <div id="step-export" class="step">
      <div class="celebration">
        <div class="celebration-icon"><span class="material-symbols-rounded icon-celebrate">emoji_events</span></div>
        <h2 class="celebration-title">¡Todo Listo!</h2>
        <p class="celebration-sub" id="export-summary"></p>
        <div class="timer-final" id="timer-final"></div>
      </div>

      <div id="review-container"></div>

      <div class="export-buttons">
        <button class="btn-export xlsx" onclick="exportXLSX()">
          <span class="material-symbols-rounded">table_chart</span> Descargar Excel
        </button>
        <button class="btn-export pdf" onclick="exportPDF()">
          <span class="material-symbols-rounded">picture_as_pdf</span> Descargar PDF
        </button>
        <button class="btn-export share" onclick="shareFiles()" id="btn-share" style="display:none">
          <span class="material-symbols-rounded">share</span> Compartir
        </button>
        <button class="btn-back-edit" onclick="backToRooms()">
          <span class="material-symbols-rounded">edit</span> Editar
        </button>
      </div>
    </div>

    <!-- Notificación toast -->
    <div class="toast" id="toast"></div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
